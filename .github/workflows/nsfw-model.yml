name: Photo checker model

# Builds the phone's on-device photo checker (nudity alerts) from the open opennsfw2 model and
# publishes it to the "models" release, where the Android build picks it up.
on:
  push:
    paths:
      - "tools/nsfw/**"
      - "tools/nudenet/**"
      - "android/sitepolicy/src/main/java/com/familymdm/agent/sitepolicy/NudeDetect.java"
      - "android/sitepolicy/src/main/java/com/familymdm/agent/sitepolicy/NudityPrep.java"
      - ".github/workflows/nsfw-model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile the phone's picture preparation
        run: |
          mkdir -p out
          javac -d out android/sitepolicy/src/main/java/com/familymdm/agent/sitepolicy/NudityPrep.java tools/nsfw/PrepCheck.java
      - name: Build and check the model
        run: |
          python -m pip install --quiet "tensorflow-cpu==2.17.1" "tf-keras==2.17.0" opennsfw2 pillow
          python tools/nsfw/convert.py
      - name: Publish to the "models" release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > MODEL-LICENSE.txt <<'EOF'
          nsfw.tflite: converted from opennsfw2 (https://github.com/bhky/opennsfw2, MIT License),
          a Keras port of Yahoo's open_nsfw model (https://github.com/yahoo/open_nsfw, BSD 2-Clause License,
          Copyright 2016, Yahoo Inc.). Used on the phone only; pictures never leave the phone.
          EOF
          gh release view models >/dev/null 2>&1 || gh release create models --title "Models" --notes "On-device models used by the phone app."
          gh release upload models nsfw.tflite MODEL-LICENSE.txt --clobber

  nudenet:
    # The man/woman detector for "cover skin of: women only / men only" (NudeNet 320n, AGPL-3.0).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile the phone's detector code
        run: |
          mkdir -p out
          javac -d out android/sitepolicy/src/main/java/com/familymdm/agent/sitepolicy/NudeDetect.java tools/nudenet/DetectCheck.java
      - name: Build and check the detector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v3.4-weights -R notAI-tech/NudeNet -p 320n.pt
          ls -la 320n.pt
          python -m pip install --quiet "ultralytics==8.3.40" "tensorflow-cpu==2.17.1" "tf-keras==2.17.0" "onnx==1.16.2" "onnxruntime==1.19.2" "onnx2tf==1.22.3" "sng4onnx==1.0.4" "onnx-graphsurgeon==0.5.2" "onnxslim==0.1.36" "tflite-support==0.4.4" nudenet scikit-image opencv-python-headless
          export YOLO_AUTOINSTALL=false
          python tools/nudenet/convert.py
      - name: Publish to the "models" release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > NUDENET-LICENSE.txt <<'EOF'
          nudenet320.tflite: converted from NudeNet's 320n model (https://github.com/notAI-tech/NudeNet),
          GNU Affero General Public License v3.0. The apps that use it are open source at
          https://github.com/abegumbo-ui/MDM. Pictures are checked on the phone only.
          EOF
          gh release view models >/dev/null 2>&1 || gh release create models --title "Models" --notes "On-device models used by the phone app."
          gh release upload models nudenet320.tflite NUDENET-LICENSE.txt --clobber