name: Build Windows LockGuard

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Bake in the dashboard address
        # Same repo variable the Android agent bakes in (see android/app/build.gradle). Written
        # before the build so LockGuard.Service's EmbeddedResource picks it up; no DASHBOARD_URL
        # set just means dashboard integration is off in this build.
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          if ($env:DASHBOARD_URL) { Set-Content -Path windows\LockGuard.Service\DashboardUrl.txt -Value $env:DASHBOARD_URL -NoNewline }
          Set-Content -Path windows\LockGuard.Service\Build.txt -Value "${{ github.run_number }}" -NoNewline

      - name: Test the filter rules
        run: dotnet test windows\LockGuard.Tests\LockGuard.Tests.csproj -c Release

      - name: Build every project
        run: |
          dotnet build windows\LockGuard.Common\LockGuard.Common.csproj -c Release
          dotnet build windows\LockGuard.Service\LockGuard.Service.csproj -c Release
          dotnet build windows\LockGuard.Setup\LockGuard.Setup.csproj -c Release

      - name: Publish the installable app
        run: |
          dotnet publish windows\LockGuard.Service -c Release -r win-x64 --self-contained false -o publish\LockGuard.Service\bin\Release\net8.0-windows\publish
          dotnet publish windows\LockGuard.Setup -c Release -r win-x64 --self-contained false -o publish\LockGuard.Setup\bin\Release\net8.0-windows\publish
          copy windows\install.ps1 publish\install.ps1
          copy windows\README.md publish\README.md

      - uses: actions/upload-artifact@v4
        with:
          name: LockGuard-windows
          path: publish

      - name: Zip it for a release asset
        run: Compress-Archive -Path publish\* -DestinationPath LockGuard-windows.zip

      - name: Build the single-file installer
        # Bundles the just-published Service and Setup apps as embedded resources inside one
        # self-contained exe (LockGuard.Installer), so there's one thing to download and
        # double-click instead of a zip plus a PowerShell script. See LockGuard.Installer/Program.cs.
        run: |
          New-Item -ItemType Directory -Force -Path windows\LockGuard.Installer\Resources | Out-Null
          Compress-Archive -Path publish\LockGuard.Service\bin\Release\net8.0-windows\publish\* -DestinationPath windows\LockGuard.Installer\Resources\Service.zip -Force
          Compress-Archive -Path publish\LockGuard.Setup\bin\Release\net8.0-windows\publish\* -DestinationPath windows\LockGuard.Installer\Resources\Setup.zip -Force
          dotnet publish windows\LockGuard.Installer -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-installer
          copy publish-installer\LockGuard.Installer.exe LockGuard-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: LockGuard-Setup-exe
          path: LockGuard-Setup.exe

      - name: Build test installers (no dashboard, so tests never appear on the real one)
        run: |
          Remove-Item windows\LockGuard.Service\DashboardUrl.txt, windows\LockGuard.Service\Build.txt -ErrorAction SilentlyContinue
          dotnet publish windows\LockGuard.Service -c Release -r win-x64 --self-contained false -o e2e-build\service
          New-Item -ItemType Directory -Force e2e | Out-Null
          $setupZip = 'windows\LockGuard.Installer\Resources\Setup.zip'
          Compress-Archive -Path e2e-build\service\* -DestinationPath windows\LockGuard.Installer\Resources\Service.zip -Force
          dotnet publish windows\LockGuard.Installer -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o e2e-build\good
          copy e2e-build\good\LockGuard.Installer.exe e2e\LockGuard-Setup-1.exe
          copy e2e-build\good\LockGuard.Installer.exe e2e\LockGuard-Setup-2.exe
          # A broken update: its LockGuard cannot start.
          Copy-Item e2e-build\service e2e-build\service-bad -Recurse
          Set-Content e2e-build\service-bad\LockGuard.Service.dll 'not a program'
          Compress-Archive -Path e2e-build\service-bad\* -DestinationPath windows\LockGuard.Installer\Resources\Service.zip -Force
          dotnet publish windows\LockGuard.Installer -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o e2e-build\bad
          copy e2e-build\bad\LockGuard.Installer.exe e2e\LockGuard-Setup-bad.exe

      - name: "End-to-end test: install, update, broken update, guard, removal"
        # This runner is a throwaway Windows machine with administrator rights.
        timeout-minutes: 25
        # Output also goes to a file: while LockGuard holds this machine's lookups, GitHub may not receive it live.
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows\ci-e2e.ps1 -Dir e2e *>&1 | Tee-Object -FilePath e2e-output.txt

      - name: Put the test machine's network back and show the logs
        # Always, so a failed test is reported instead of leaving this machine unable to reach GitHub.
        if: always()
        timeout-minutes: 5
        run: |
          if (Test-Path e2e-output.txt) { "--- test output"; Get-Content e2e-output.txt }
          foreach ($f in 'install.log', 'guard.log') { $p = Join-Path $env:ProgramFiles "LockGuard Guard\$f"; if (Test-Path $p) { "--- $f"; Get-Content $p } }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows\Remove-LockGuard.ps1
          Get-DnsClientServerAddress -AddressFamily IPv4 | Format-Table InterfaceAlias, ServerAddresses -AutoSize

      - name: Publish a versioned release
        # Only from main, same reasoning as the Android workflow: a feature-branch push shouldn't
        # create a public release of its own, only a merge should.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "lockguard-v${{ github.run_number }}" LockGuard-Setup.exe LockGuard-windows.zip `
            --title "LockGuard build ${{ github.run_number }}" `
            --notes "Windows internet-lockdown app, build ${{ github.run_number }}. Download LockGuard-Setup.exe and run it (it will ask for admin). LockGuard-windows.zip is the same build for anyone who wants to run install.ps1 manually. Commit: ${{ github.sha }}" `
            --target "$env:GITHUB_SHA"
          # A fixed "lockguard-latest" release with a small lockguard.json saying which build is newest.
          # The dashboard reads it like the phones read version.json: GitHub's API limits callers that
          # are not signed in (Cloudflare's shared addresses run out); plain release downloads do not.
          $sha = (Get-FileHash LockGuard-Setup.exe -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/lockguard-v${{ github.run_number }}/LockGuard-Setup.exe"
          @{ build = ${{ github.run_number }}; url = $url; sha256 = $sha } | ConvertTo-Json -Compress | Set-Content -Encoding ascii lockguard.json
          gh release view lockguard-latest *> $null
          if ($LASTEXITCODE -ne 0) { gh release create lockguard-latest --title "LockGuard: newest build pointer" --notes "lockguard.json points at the newest lockguard-vN release. Updated automatically." --latest=false --target "$env:GITHUB_SHA" }
          gh release upload lockguard-latest lockguard.json --clobber
          exit 0
