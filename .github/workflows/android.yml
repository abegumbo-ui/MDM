name: Build Android agent

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check the offline policy rules
        run: |
          curl -sSL -o json.jar https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          mkdir -p out
          javac -cp json.jar -d out android/sitepolicy/src/main/java/com/familymdm/agent/sitepolicy/SitePolicy.java android/app/src/main/java/com/familymdm/agent/LocalPolicy.java android/app/src/test/java/com/familymdm/agent/LocalPolicyCheck.java android/sitepolicy/src/test/java/com/familymdm/agent/sitepolicy/SitePolicyCheck.java
          java -cp json.jar:out com.familymdm.agent.LocalPolicyCheck
          java -cp json.jar:out com.familymdm.agent.sitepolicy.SitePolicyCheck
      - name: Restore the release signing key
        # Not committed to the repo -- RELEASE_KEYSTORE_B64 is the keystore file, base64-encoded,
        # stored as a GitHub Actions secret. See android/README.md for how to generate/set it.
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 secret is not set -- see android/README.md"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > android/app/release.keystore
      - name: Build release APKs (agent + browser)
        # "Release" build type here just means Gradle's normal release settings (debuggable=false,
        # our own dedicated signing key) -- these still aren't Play Store builds, just sideloaded
        # ones signed with something other than the SDK's generic, well-known debug.keystore.
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: gradle -p android :app:assembleRelease :browser:assembleRelease --no-daemon --stacktrace
      - name: Name the APKs and describe this build
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk mdm-agent.apk
          cp android/browser/build/outputs/apk/release/browser-release.apk mdm-browser.apk
          # URL-safe base64 of the raw SHA-256 digest, no padding -- exactly the format Android's
          # QR-code device-owner provisioning expects for EXTRA_PROVISIONING_DEVICE_ADMIN_PACKAGE_CHECKSUM.
          AGENT_SHA256=$(openssl dgst -binary -sha256 mdm-agent.apk | openssl base64 | tr '+/' '-_' | tr -d '=')
          echo "{\"versionCode\": ${{ github.run_number }}, \"sha256\": \"$AGENT_SHA256\"}" > version.json
      - uses: actions/upload-artifact@v4
        with:
          name: mdm-agent
          path: |
            mdm-agent.apk
            mdm-browser.apk
      - name: Publish to the "latest" release
        # Every push to a branch with android/** changes runs this workflow, including a PR
        # branch's own push and then, right after merging, another run on main for that same
        # commit's content. Publishing from both raced to overwrite the same "latest" release:
        # whichever run's "gh release upload --clobber" finished last won, so version.json (from
        # one run) and mdm-agent.apk (from a different run, built with a different embedded
        # versionCode) could end up mismatched -- the dashboard reporting a build the installed
        # APK doesn't actually match. Only the push that lands on main is ever the real release.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest agent build" --notes "Automatic build of the Android agent and browser." --target "$GITHUB_SHA"
          gh release upload latest mdm-agent.apk mdm-browser.apk version.json --clobber
          # Fixes the flag on every run too, in case an earlier run created this release as a
          # prerelease (this session's own gh token can't edit an already-published release, so
          # that correction has to happen here, with the Actions-provided token, instead).
          gh release edit latest --prerelease=false --latest=false
      - name: Publish a versioned release
        # "latest" above is the one phones and the dashboard actually check against (it's a fixed,
        # never-changing URL on purpose -- see its own comment). This is the human-facing release
        # history alongside it: a new, permanent release for every build, so past versions stay
        # downloadable and you can see what changed build-over-build on the repo's Releases page.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" mdm-agent.apk mdm-browser.apk version.json \
            --title "Agent + Browser build ${{ github.run_number }}" \
            --notes "Android agent and browser, build ${{ github.run_number }}. Commit: ${{ github.sha }}" \
            --target "$GITHUB_SHA"
