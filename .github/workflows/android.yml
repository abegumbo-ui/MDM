name: Build Android agent

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check the offline policy rules
        run: |
          curl -sSL -o json.jar https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          mkdir -p out
          javac -cp json.jar -d out android/sitepolicy/src/main/java/com/familymdm/agent/sitepolicy/SitePolicy.java android/app/src/main/java/com/familymdm/agent/LocalPolicy.java android/app/src/test/java/com/familymdm/agent/LocalPolicyCheck.java android/sitepolicy/src/test/java/com/familymdm/agent/sitepolicy/SitePolicyCheck.java
          java -cp json.jar:out com.familymdm.agent.LocalPolicyCheck
          java -cp json.jar:out com.familymdm.agent.sitepolicy.SitePolicyCheck
      - name: Build debug APKs (agent + browser)
        run: gradle -p android :app:assembleDebug :browser:assembleDebug --no-daemon --stacktrace
      - name: Name the APKs and describe this build
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mdm-agent.apk
          cp android/browser/build/outputs/apk/debug/browser-debug.apk mdm-browser.apk
          echo "{\"versionCode\": ${{ github.run_number }}}" > version.json
      - uses: actions/upload-artifact@v4
        with:
          name: mdm-agent
          path: |
            mdm-agent.apk
            mdm-browser.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest agent build" --notes "Automatic build of the Android agent and browser (debug-signed)." --prerelease --target "$GITHUB_SHA"
          gh release upload latest mdm-agent.apk mdm-browser.apk version.json --clobber
