name: Build new Browser (Jelly)

# The Browser, based on LineageOS Jelly (android-jelly/, Apache-2.0) with the family dashboard's
# rules built in. On main it is published as mdm-browser.apk in the "latest" release (where the
# Agent and the dashboard get it from) and in "browser-preview".
on:
  push:
    paths:
      - "android-jelly/**"
      - "android/sitepolicy/**"
      - ".github/workflows/browser-jelly.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore the release signing key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then echo "::error::RELEASE_KEYSTORE_B64 is not set"; exit 1; fi
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > android/app/release.keystore
      - name: Get the photo checker model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android-jelly/app/src/main/assets
          gh release download models -p nsfw.tflite -D android-jelly/app/src/main/assets --clobber || echo "::warning::No photo checker model yet."
          gh release download models -p nudenet320.tflite -D android-jelly/app/src/main/assets --clobber || echo "::warning::No man/woman detector yet."
      - name: Build
        working-directory: android-jelly
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          chmod +x gradlew
          # Every dashboard rule, checked without a phone (GuardTest).
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*.apk ../mdm-browser-new.apk
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests
          path: android-jelly/app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: mdm-browser-new
          path: mdm-browser-new.apk
      - name: Publish (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view browser-preview >/dev/null 2>&1 || gh release create browser-preview --prerelease --title "New Browser (preview)" --notes "The new Browser based on LineageOS Jelly, with the family dashboard's rules. Installs over the current Browser."
          gh release upload browser-preview mdm-browser-new.apk --clobber
          cp mdm-browser-new.apk mdm-browser.apk
          gh release upload latest mdm-browser.apk --clobber
