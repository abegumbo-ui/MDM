org.gradle.jvmargs=-Xmx2g
# The Browser (browserlib) is built on AndroidX; the MDM app's own code does not use it.
android.useAndroidX=true
# The Browser is compiled against Android 16 (API 36); this Android Gradle Plugin was tested up to 34.
android.suppressUnsupportedCompileSdk=36
android.nonTransitiveRClass=true
