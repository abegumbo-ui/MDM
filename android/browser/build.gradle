plugins {
    id 'com.android.application'
}

// Same numbering scheme as the agent app, so "newer build" always means "install over the old one".
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.familymdm.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.familymdm.browser"
        minSdk 26
        targetSdk 30
        versionCode buildNumber
        versionName "0.1." + buildNumber
        // Your dashboard's own https:// address, baked in at build time (set the DASHBOARD_URL
        // repository variable in GitHub — Settings -> Secrets and variables -> Actions -> Variables).
        // Lets Browser self-register with no code and no manual entry; empty if unset, in which case
        // it falls back to asking for the address once.
        resValue "string", "default_server", (System.getenv("DASHBOARD_URL") ?: "")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The SAME key the agent app is signed with (not a copy of the file — this points at
    // ../app/release.keystore). Both apps must share a signer for the signature-level permission
    // that lets them talk to each other to be granted automatically, with no prompt.
    signingConfigs {
        release {
            storeFile file('../app/release.keystore')
            storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "unset"
            keyAlias 'mdmagentrelease'
            keyPassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "unset"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    lint {
        // See android/app/build.gradle's matching block for why.
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':sitepolicy')
}
