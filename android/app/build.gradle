plugins {
    id 'com.android.application'
}

// Each GitHub build gets a higher version, so a newer build always counts as an update.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.familymdm.agent'
    compileSdk 34

    defaultConfig {
        applicationId "com.familymdm.agent"
        minSdk 26
        // Sideloaded device-owner app; targeting 30 keeps background/foreground-service rules simple.
        targetSdk 30
        versionCode buildNumber
        versionName "0.3." + buildNumber
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // A fixed signing key (committed on purpose) so every build installs as an update over the last one.
    // This key is only for sideloading onto your own phones; don't reuse it for anything public.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
