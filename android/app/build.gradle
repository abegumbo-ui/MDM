plugins {
    id 'com.android.application'
}

android {
    namespace 'com.familymdm.agent'
    compileSdk 34

    defaultConfig {
        applicationId "com.familymdm.agent"
        minSdk 26
        // Sideloaded device-owner app; targeting 30 keeps background/foreground-service rules simple.
        targetSdk 30
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
