plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Each GitHub build gets a higher version, so a newer build always counts as an update.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.familymdm.agent'
    compileSdk 36

    defaultConfig {
        applicationId "com.familymdm.agent"
        minSdk 26
        // Sideloaded device-owner app; targeting 30 keeps background/foreground-service rules simple.
        targetSdk 30
        versionCode buildNumber
        versionName "0.3." + buildNumber
        // Your dashboard's own https:// address, baked in at build time (set the DASHBOARD_URL
        // repository variable), so enrolling only ever needs typing a code, never the server too.
        // Leave it unset to build a generic APK that still asks for the server once.
        resValue "string", "default_server", (System.getenv("DASHBOARD_URL") ?: "")
        // yt-dlp (downloads) ships native code and Python for 64-bit phones only (keeps the app smaller).
        ndk {
            abiFilters 'arm64-v8a'
        }
        // Where the Browser's "check for updates" looks (unused here: this app updates itself).
        resValue "string", "update_url", (System.getenv("GITHUB_REPOSITORY") ? "https://github.com/" + System.getenv("GITHUB_REPOSITORY") + "/releases/download/latest/browser-version.json" : "")
    }

    // Two outputs from the same source, same applicationId, same signing key:
    //  - "full" is the normal, every-feature build. This is what already-enrolled phones self-update to.
    //  - "enroll" is only for the very first install. It's missing the permissions (QUERY_ALL_PACKAGES,
    //    the two location permissions) that make a sideloaded device-owner app look most like spyware to
    //    Google Play Protect's heuristics -- see android/README.md. Once it's device owner, it self-updates
    //    to "full" immediately (Updater.java), which silently re-grants those permissions with no prompt
    //    (the same dpm.setPermissionGrantState() call PolicyApplier already uses for the Wi-Fi name).
    //    "enroll" is given a lower versionCode than this same run's "full" build on purpose, so that
    //    self-update check (a strict "newer build available?" > comparison) actually fires right away.
    flavorDimensions "variant"
    productFlavors {
        full {
            dimension "variant"
            versionCode buildNumber
        }
        enroll {
            dimension "variant"
            versionCode Math.max(buildNumber - 1, 1)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // A fixed signing key (committed on purpose) so every build installs as an update over the last
    // one. This key is only for sideloading onto your own phones; don't reuse it for anything
    // public. A dedicated key instead of the SDK's generic debug.keystore (androiddebugkey /
    // "android" / "android" -- the exact same key every Android Studio install generates by
    // default) -- that shared, well-known key is itself one of the things Google Play Protect's
    // heuristics weigh when deciding whether to flag a sideloaded app.
    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "unset"
            keyAlias 'mdmagentrelease'
            keyPassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "unset"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            // debuggable defaults to false for the release build type (unlike debug, where
            // Gradle sets it true automatically) -- that flag is the other thing Play Protect
            // and the Play Console both flag a sideloaded app for.
        }
    }

    // yt-dlp's programs are packed as libraries that must be unpacked to run.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        // lintVitalRelease (a mandatory, fatal-by-default check that only runs for the release
        // build type, never for debug) enforces Play Store submission requirements -- e.g. a
        // minimum targetSdk -- that don't apply to an app that's never submitted there.
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':sitepolicy')
    // The family Browser, as an add-on of this app (its icon is turned on from the dashboard).
    implementation project(':browserlib')
    // yt-dlp for Android: downloads YouTube videos; it updates itself at run time (YouTube changes often).
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    // The on-phone photo checker (NudityCheck); the model file comes from the "models" release at build time.
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    // The real Play Store protocol, for PlayUpdates.kt -- see SETUP.md's "Keeping a few apps
    // updated" section. Same open-source library Aurora Store itself is built on.
    implementation 'com.auroraoss:gplayapi:3.4.8'
}
