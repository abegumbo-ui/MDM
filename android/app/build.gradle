plugins {
    id 'com.android.application'
}

// Each GitHub build gets a higher version, so a newer build always counts as an update.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.familymdm.agent'
    compileSdk 34

    defaultConfig {
        applicationId "com.familymdm.agent"
        minSdk 26
        // Sideloaded device-owner app; targeting 30 keeps background/foreground-service rules simple.
        targetSdk 30
        versionCode buildNumber
        versionName "0.3." + buildNumber
        // Your dashboard's own https:// address, baked in at build time (set the DASHBOARD_URL
        // repository variable), so enrolling only ever needs typing a code, never the server too.
        // Leave it unset to build a generic APK that still asks for the server once.
        resValue "string", "default_server", (System.getenv("DASHBOARD_URL") ?: "")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // A fixed signing key (committed on purpose) so every build installs as an update over the last
    // one. This key is only for sideloading onto your own phones; don't reuse it for anything
    // public. A dedicated key instead of the SDK's generic debug.keystore (androiddebugkey /
    // "android" / "android" -- the exact same key every Android Studio install generates by
    // default) -- that shared, well-known key is itself one of the things Google Play Protect's
    // heuristics weigh when deciding whether to flag a sideloaded app.
    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "unset"
            keyAlias 'mdmagentrelease'
            keyPassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "unset"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            // debuggable defaults to false for the release build type (unlike debug, where
            // Gradle sets it true automatically) -- that flag is the other thing Play Protect
            // and the Play Console both flag a sideloaded app for.
        }
    }

    lint {
        // lintVitalRelease (a mandatory, fatal-by-default check that only runs for the release
        // build type, never for debug) enforces Play Store submission requirements -- e.g. a
        // minimum targetSdk -- that don't apply to an app that's never submitted there.
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':sitepolicy')
}
