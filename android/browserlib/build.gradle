// The family Browser (android-jelly) as a LIBRARY of the MDM app: its screens, rules and resources are built
// into the MDM app, so the Browser is an add-on (an icon turned on from the dashboard), not a second app.
// The sources stay in android-jelly/, which also still builds the standalone Browser; this module only points at them.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'org.lineageos.jelly'
    compileSdk 36

    defaultConfig {
        minSdk 26
        // The dashboard's address and the update address, as in the standalone Browser (the MDM app has its own).
        resValue "string", "default_server", (System.getenv("DASHBOARD_URL") ?: "")
        resValue "string", "update_url", (System.getenv("GITHUB_REPOSITORY") ? "https://github.com/" + System.getenv("GITHUB_REPOSITORY") + "/releases/download/latest/browser-version.json" : "")
    }

    buildFeatures {
        resValues true
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['../../android-jelly/app/src/main/java']
            res.srcDirs = ['../../android-jelly/app/src/main/res']
            assets.srcDirs = ['../../android-jelly/app/src/main/assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    lint {
        abortOnError false
    }
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

dependencies {
    // The dashboard's shared rules (site lists, YouTube, word filter, picture checks) - the same module the MDM app uses.
    implementation project(':sitepolicy')
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.room:room-ktx:2.8.0'
    implementation 'androidx.room:room-runtime:2.8.0'
    kapt 'androidx.room:room-compiler:2.8.0'
    implementation 'androidx.transition:transition:1.4.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
